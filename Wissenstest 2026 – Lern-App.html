<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1e252d;--tx:#eceff3;--mu:#9aa5b1;--ac:#ef5350;--ac2:#5bc0de;--ok:#66bb6a;--okb:#1e3a22;--badb:#3d1f1f;--bd:#33404d}}
:root[data-theme="dark"]{--bg:#14181d;--card:#1e252d;--tx:#eceff3;--mu:#9aa5b1;--ac:#ef5350;--ac2:#5bc0de;--ok:#66bb6a;--okb:#1e3a22;--badb:#3d1f1f;--bd:#33404d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 2px}h2{font-size:1.15rem;margin:0 0 8px}
.sub{color:var(--mu);margin:0 0 16px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.topic{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer}
.topic input{width:20px;height:20px;accent-color:var(--ac)}
.topic small{color:var(--mu);display:block}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--ac);color:#fff;font-weight:600}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.4;cursor:default}
.grow{flex:1}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:8px 0 14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac2)}
.tag{display:inline-block;font-size:.78rem;background:var(--ac2);color:#fff;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);margin-bottom:8px;font-weight:500}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.bad{background:var(--badb);border-color:var(--ac)}
.big{font-size:2.4rem;font-weight:800;text-align:center;margin:8px 0}
.wrong{border-left:4px solid var(--ac);padding-left:10px;margin:10px 0}
.wrong small{color:var(--mu)}
</style></head><body><main id="app"></main>

const app=document.getElementById("app");
const sel=new Set(D.map((_,k)=>k));
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const E=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let S={};
function home(){
 app.innerHTML=`<h1>🚒 Wissenstest 2026</h1><p class="sub">Umgang mit Schläuchen, Armaturen &amp; Leinen – wähle deine Themen:</p>
 <div class="row" style="margin-bottom:10px"><button class="sec" id="all">Alle</button><button class="sec" id="none">Keine</button></div>
 ${D.map((t,k)=>`<label class="topic"><input type="checkbox" data-k="${k}" ${sel.has(k)?"checked":""}><span>${E(t.n)}<small>${t.i.length} Lernkarten · ${t.q.length} Fragen</small></span></label>`).join("")}
 <div class="row" style="margin-top:14px"><button class="grow" id="st">📖 Durchgucken</button><button class="grow" id="qz">✍️ Abfrage / Probe</button></div>`;
 const upd=()=>{document.getElementById("st").disabled=document.getElementById("qz").disabled=!sel.size};
 app.querySelectorAll("input").forEach(c=>c.onchange=()=>{c.checked?sel.add(+c.dataset.k):sel.delete(+c.dataset.k);upd()});
 all.onclick=()=>{D.forEach((_,k)=>sel.add(k));home()};none.onclick=()=>{sel.clear();home()};
 st.onclick=startStudy;qz.onclick=startQuiz;upd();
}
function startStudy(){S={c:[...sel].sort().flatMap(k=>D[k].i.map(x=>({n:D[k].n,t:x[0],x:x[1]}))),p:0};study()}
function study(){
 const c=S.c[S.p],n=S.c.length;
 app.innerHTML=`<div class="row"><button class="sec" id="h">← Start</button><span class="grow"></span><span class="sub" style="align-self:center;margin:0">${S.p+1} / ${n}</span></div>
 <div class="bar"><i style="width:${(S.p+1)/n*100}%"></i></div>
 <div class="card"><span class="tag">${E(c.n)}</span><h2>${E(c.t)}</h2><p>${E(c.x)}</p></div>
 <div class="row"><button class="sec grow" id="pv" ${S.p?"":"disabled"}>Zurück</button><button class="grow" id="nx">${S.p<n-1?"Weiter":"Fertig"}</button></div>`;
 h.onclick=home;pv.onclick=()=>{S.p--;study()};nx.onclick=()=>{S.p<n-1?(S.p++,study()):done()};
 function done(){app.innerHTML=`<div class="card"><div class="big">🎉</div><h2 style="text-align:center">Alle Karten durchgesehen!</h2><div class="row"><button class="grow" id="q2">Jetzt abfragen</button><button class="sec grow" id="h2">Start</button></div></div>`;q2.onclick=startQuiz;h2.onclick=home}
}
function startQuiz(){S={q:sh([...sel].flatMap(k=>D[k].q.map(x=>({n:D[k].n,q:x[0],a:x[1],o:x})))),p:0,ok:0,bad:[]};quiz()}
function quiz(){
 const q=S.q[S.p],n=S.q.length,o=sh(q.o.slice(1));
 app.innerHTML=`<div class="row"><button class="sec" id="h">← Start</button><span class="grow"></span><span class="sub" style="align-self:center;margin:0">Frage ${S.p+1} / ${n} · ✔ ${S.ok}</span></div>
 <div class="bar"><i style="width:${S.p/n*100}%"></i></div>
 <div class="card"><span class="tag">${E(q.n)}</span><h2>${E(q.q)}</h2></div>
 <div id="os">${o.map(t=>`<button class="opt">${E(t)}</button>`).join("")}</div><div id="fb"></div>`;
 h.onclick=home;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const r=b.textContent===q.a;r?S.ok++:S.bad.push({q:q.q,a:q.a,g:b.textContent});
  app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add("ok")});
  if(!r)b.classList.add("bad");
  fb.innerHTML=`<p><b>${r?"✅ Richtig!":"❌ Leider falsch."}</b>${r?"":" Richtig ist: "+E(q.a)}</p><button class="grow" style="width:100%" id="nx">${S.p<n-1?"Nächste Frage":"Ergebnis"}</button>`;
  nx.onclick=()=>{S.p++;S.p<n?quiz():result()};nx.scrollIntoView({block:"nearest"});
 });
}
function result(){
 const n=S.q.length,pc=Math.round(S.ok/n*100);
 app.innerHTML=`<div class="card"><div class="big">${pc>=80?"🏆":pc>=50?"👍":"💪"} ${pc} %</div><p style="text-align:center">${S.ok} von ${n} richtig</p></div>
 ${S.bad.length?`<h2>Nochmal anschauen</h2>${S.bad.map(w=>`<div class="wrong"><b>${E(w.q)}</b><br>✔ ${E(w.a)}<br><small>Deine Antwort: ${E(w.g)}</small></div>`).join("")}`:""}
 <div class="row" style="margin-top:14px">${S.bad.length?`<button class="grow" id="rt">Nur Fehler wiederholen</button>`:""}<button class="sec grow" id="ag">Neue Probe</button><button class="sec grow" id="hm">Start</button></div>`;
 const bad=S.bad.map(w=>S.q.find(x=>x.q===w.q));
 if(S.bad.length)rt.onclick=()=>{S={q:sh(bad),p:0,ok:0,bad:[]};quiz()};
 ag.onclick=startQuiz;hm.onclick=home;
}
home();
</script></body></html>
